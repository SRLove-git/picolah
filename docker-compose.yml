name: picolah

services:
  picolah:
    build:
      context: .
      dockerfile: Dockerfile
    image: picolah:latest
    container_name: picolah
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PICOLAH_ENTRY_PATH: ${PICOLAH_ENTRY_PATH:-/7hk9ho}
      # Set DATABASE_URL in .env to use PostgreSQL; empty keeps SQLite.
      DATABASE_URL: ${DATABASE_URL:-}
      # The website source now lives under /app/web, but the SQLite file keeps
      # using the host mount at /app/data so existing deployments keep their DB.
      PICOLAH_DB_PATH: /app/data/picolah.db
      CRAWLER_TOOL_URL: http://crawler-tool:8790
      CRAWLER_TOOL_TOKEN: ${CRAWLER_TOOL_TOKEN}
    # Bind only to the docker_default bridge gateway: reachable by the shared
    # 443 nginx-lb (which lives on that network) and by the host, not the internet.
    ports:
      - "172.20.0.1:8787:8787"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # Optional PostgreSQL. Start with: docker compose --profile postgres up -d
  # Then set DATABASE_URL=postgres://picolah:<password>@postgres:5432/picolah in .env
  postgres:
    image: postgres:16-alpine
    container_name: picolah-postgres
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: picolah
      POSTGRES_USER: picolah
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picolah -d picolah"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # Optional daily SQLite backup. Start with: docker compose --profile backup up -d
  backup:
    image: picolah:latest
    container_name: picolah-backup
    restart: unless-stopped
    profiles: ["backup"]
    depends_on:
      picolah:
        condition: service_healthy
    environment:
      PICOLAH_DB_PATH: /app/data/picolah.db
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./data:/app/data
    command: ["sh", "-c", "while true; do sh scripts/backup-db.sh; sleep 86400; done"]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Demo-only price nudger; enable/disable separately from the real crawler tool.
  mock-crawler:
    image: picolah:latest
    container_name: picolah-mock
    restart: unless-stopped
    depends_on:
      picolah:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PICOLAH_API_BASE: http://picolah:8787
      PICOLAH_INGEST_KEY: ${INGEST_API_KEY}
      MOCK_INTERVAL_MS: ${MOCK_INTERVAL_MS:-120000}
      MOCK_BATCH_SIZE: ${MOCK_BATCH_SIZE:-8}
      MOCK_MARKETS: ${MOCK_MARKETS:-}
      MOCK_STATE_FILE: /app/mock-state/state.json
    command: ["./web/node_modules/.bin/tsx", "web/mock/crawler.ts"]
    volumes:
      - ./mock-state:/app/mock-state
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Internal, authenticated LangChain tool target. It performs a real crawl
  # only when the user explicitly asks for live/fresh prices.
  crawler-tool:
    build:
      context: .
      dockerfile: crawler/Dockerfile
    image: picolah-crawler-tool:latest
    container_name: picolah-crawler-tool
    restart: unless-stopped
    profiles: ["crawler"]
    depends_on:
      picolah:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PICOLAH_API_BASE: http://picolah:8787
      PICOLAH_INGEST_KEY: ${INGEST_API_KEY}
      CRAWLER_TOOL_HOST: 0.0.0.0
      CRAWLER_TOOL_PORT: 8790
      CRAWLER_TOOL_TOKEN: ${CRAWLER_TOOL_TOKEN}
    expose:
      - "8790"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

# picolah.com — appended to /opt/diy/docker/nginx/nginx.conf (inside the shared
# 443 nginx-lb container at /etc/nginx/conf.d/default.conf).
# Keep this file in sync with the block on the server.
#
# Upstream: the picolah compose stack publishes 8787 on 172.20.0.1
# (docker_default bridge gateway), the same pattern used by idol/buzud.

server {
    listen 443 ssl;
    http2 on;
    server_name picolah.com www.picolah.com;

    ssl_certificate     /etc/nginx/certs/picolah.com.pem;
    ssl_certificate_key /etc/nginx/certs/picolah.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 12m;
    client_body_timeout 60s;
    send_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://172.20.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # SSE (/api/chat): no buffering, long-lived reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
